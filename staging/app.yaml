apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-page
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>TKE-ARGO-FLOW — Staging</title></head>
      <body style="font-family:Arial;text-align:center;padding:80px;background:#fff4dd">
        <h1>TKE-ARGO-FLOW</h1>
        <h2>Staging - Version 2</h2>
        <p>Git &rarr; Argo CD &rarr; Kubernetes &rarr; Web page</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-page
  template:
    metadata:
      labels:
        app: flow-page
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: flow-page
---
apiVersion: v1
kind: Service
metadata:
  name: flow-page
spec:
  selector:
    app: flow-page
  ports:
    - port: 80
      targetPort: 80
